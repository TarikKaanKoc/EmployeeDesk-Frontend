# CD: build the console image in Azure Container Registry and roll a new
# revision of the web Container App. OIDC sign-in, no stored secret.
# Repository secrets: AZURE_CLIENT_ID · AZURE_TENANT_ID · AZURE_SUBSCRIPTION_ID
# Repository variables: AZURE_RESOURCE_GROUP · AZURE_ACR_NAME
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.AZURE_ACR_NAME }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push (linux/amd64)
        run: |
          az acr build -r "$ACR" --platform linux/amd64 \
            -t "employeedesk-web:$TAG" -t employeedesk-web:latest .

      - name: Roll the web console
        run: |
          az containerapp update -g "$RG" -n employeedesk-web \
            --image "$ACR.azurecr.io/employeedesk-web:$TAG" --revision-suffix "g${TAG:0:7}" -o none

      - name: Smoke test
        run: |
          fqdn=$(az containerapp show -g "$RG" -n employeedesk-web --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS -o /dev/null "https://$fqdn/login"
